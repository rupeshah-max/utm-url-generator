<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scheduled Tasks — Nimble Campaign URL Generator</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css" />
</head>
<body>
  <div class="aura" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>
  <main class="container">
    <header class="page-head">
      <div class="page-head-text">
        <p class="eyebrow">Proxy Network Console</p>
        <h1>Scheduled Tasks</h1>
        <p class="subhead">Every bulk import queued to run later, with live progress and controls to edit, cancel, or delete.</p>
      </div>
    </header>

    <section class="glass data-table">
      <div class="table-header">
        <h2>Tasks</h2>

        <div class="toolbar">
          <div class="search-field">
            <input type="search" id="searchInput" placeholder="Search file name..." aria-label="Search tasks" />
          </div>

          <select id="filterStatus" aria-label="Filter by status">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>

          <div class="date-range-field">
            <input type="text" id="dateFrom" placeholder="Scheduled from" />
            <span>&ndash;</span>
            <input type="text" id="dateTo" placeholder="Scheduled to" />
          </div>

          <select id="sortBy" aria-label="Sort tasks">
            <option value="newest">Sort: Newest First</option>
            <option value="scheduledAt">Sort: Scheduled Time</option>
          </select>

          <button type="button" id="resetFilters" class="ghost small">Reset</button>
          <button type="button" id="refreshTasks" class="ghost small">Refresh</button>
        </div>
      </div>

      <div class="pagination-top">
        <div class="page-size">
          <label for="pageSize">Rows per page</label>
          <select id="pageSize">
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="custom">Custom</option>
            <option value="all">All</option>
          </select>
          <input type="number" id="customPageSize" min="1" max="1000" placeholder="Rows" aria-label="Custom rows per page" hidden />
        </div>
        <div class="page-nav">
          <button type="button" id="prevPageBtn" class="ghost small">‹ Prev</button>
          <span id="pageIndicator">Page 1 of 1</span>
          <button type="button" id="nextPageBtn" class="ghost small">Next ›</button>
        </div>
      </div>

      <p id="resultCount" class="result-count"></p>

      <div class="table-wrap">
        <table id="taskTable">
          <thead>
            <tr>
              <th>Row #</th>
              <th>File Name</th>
              <th>Status</th>
              <th>Progress</th>
              <th>Scheduled For</th>
              <th>Date Added</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="pagination">
        <div class="page-nav">
          <button type="button" id="prevPageBtn2" class="ghost small">‹ Prev</button>
          <span id="pageIndicator2">Page 1 of 1</span>
          <button type="button" id="nextPageBtn2" class="ghost small">Next ›</button>
        </div>
      </div>
    </section>
  </main>

  <div id="editModal" class="glass" style="display:none; position:fixed; inset:0; margin:auto; width:min(440px, calc(100vw - 32px)); height:fit-content; padding:22px; z-index:1100;">
    <h2 style="margin-top:0; font-family:var(--font-display); font-size:16px;">Edit Scheduled Task</h2>
    <div class="field" style="margin-bottom:12px;">
      <label for="editFileName">File name</label>
      <input id="editFileName" type="text" />
    </div>
    <div class="field" style="margin-bottom:16px;">
      <label for="editScheduleDateTime">Run at</label>
      <input id="editScheduleDateTime" type="text" placeholder="Pick date & time" />
    </div>
    <div class="actions" style="margin-top:0;">
      <button type="button" id="saveEditBtn">Save Changes</button>
      <button type="button" id="cancelEditBtn" class="ghost">Cancel</button>
    </div>
  </div>
  <div id="editModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(2,6,16,.6); z-index:1050;"></div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/scheduled-tasks.js" defer></script>
  <script src="./js/nav.js" defer></script>
</body>
</html>
